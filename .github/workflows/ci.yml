name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-server:
    name: Web and server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Angular component and utility tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run test:native
      - run: npm run test:sync
      - run: npm run test:reminders
      - run: npm run test:server
      - run: npm run test:scale
      - run: npm run test:mcp

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests, assemble, and lint
        working-directory: android-native
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
